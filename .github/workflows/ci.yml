name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  validate:
    name: Validate & Verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Manifest & Script Syntax
        run: npm run check

      - name: Install Chromium for offline browser tests
        if: matrix.node-version == '22.x'
        run: npx playwright install --with-deps chromium

      - name: Run regression and viewport tests
        if: matrix.node-version == '22.x'
        run: npm test

      - name: Verify Packaging & Archives
        run: npm run pack

      - name: Lint Firefox Build
        if: matrix.node-version == '20.x'
        run: |
          mkdir firefox-build
          unzip -q dist/pretty-fitgirl-firefox-v*.zip -d firefox-build
          npx --yes web-ext lint --source-dir firefox-build --warnings-as-errors=false
      - name: Upload Test Artifact
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: pretty-fitgirl-package
          path: dist/*.zip
          retention-days: 7
